<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;1,400&display=swap">
<style>
/* Layout: a two-pane study. An SVG map of the algorithm on the left, a sticky drill-down panel on the right. */
:root{
  --ground:#F3F5F2;--surface:#FFFFFF;--ink:#18211E;--muted:#56645F;--rule:#D5DCD8;
  --det:#1F6F63;--det-fill:#E3F1ED;--ml:#5B4BA8;--ml-fill:#ECE9FA;
  --rem:#A9432B;--rem-fill:#F8E7E1;--io-fill:#EEF1EF;--io:#7A8883;
  --warn-fill:#FBF3E4;--warn:#8A5A12;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;--ground:#111614;--surface:#18201D;--ink:#E4EBE8;--muted:#9AA9A3;--rule:#2C3733;
  --det:#62C3B1;--det-fill:#16302B;--ml:#A99EEC;--ml-fill:#25213F;
  --rem:#E88C70;--rem-fill:#3A211A;--io-fill:#1E2724;--io:#7F8F89;--warn-fill:#2E2515;--warn:#E3B566;}}
:root[data-theme="dark"]{
  color-scheme:dark;--ground:#111614;--surface:#18201D;--ink:#E4EBE8;--muted:#9AA9A3;--rule:#2C3733;
  --det:#62C3B1;--det-fill:#16302B;--ml:#A99EEC;--ml-fill:#25213F;
  --rem:#E88C70;--rem-fill:#3A211A;--io-fill:#1E2724;--io:#7F8F89;--warn-fill:#2E2515;--warn:#E3B566;}
body{background:var(--ground);color:var(--ink);font:15px/1.6 var(--sans);padding-inline:20px;padding-block:28px 48px}
.wrap{max-width:1300px;margin:0 auto;display:grid;gap:24px}
header{display:grid;gap:6px;max-width:76ch}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:600 clamp(26px,4vw,36px)/1.15 var(--cond);margin:0;text-wrap:balance;letter-spacing:-.01em}
header p{margin:0;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;border-block:1px solid var(--rule);padding-block:10px}
.tabs{display:flex;gap:4px;background:var(--io-fill);padding:3px;border-radius:8px}
.tabs button{font:500 13px/1 var(--sans);color:var(--muted);background:none;border:0;padding:9px 14px;border-radius:6px;cursor:pointer}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;font:12px/1 var(--mono);color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;border:1px solid}
.main{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,0.86fr);gap:32px;align-items:start}
@media (max-width:900px){.main{grid-template-columns:1fr}}
.diagram{overflow-x:auto}
.diagram svg{width:100%;max-width:820px;height:auto;display:block;margin:0 auto}
.hint{font:12px/1.4 var(--mono);color:var(--muted);text-align:center;margin:10px 0 0}
svg text{font-family:var(--sans)}
.nt{font:600 14px var(--cond)}
.ns{font-size:11.5px}
.n{cursor:pointer;outline:none}
.n rect{stroke-width:1;transition:stroke-width .12s}
.n:hover rect{stroke-width:2}
.n:focus-visible rect{stroke-width:2.5;stroke-dasharray:4 3}
.n.sel rect{stroke-width:3}
.det rect{fill:var(--det-fill);stroke:var(--det)} .det text{fill:var(--ink)} .det .ns{fill:var(--det)}
.ml rect{fill:var(--ml-fill);stroke:var(--ml)} .ml text{fill:var(--ink)} .ml .ns{fill:var(--ml)}
.io rect{fill:var(--io-fill);stroke:var(--io)} .io text{fill:var(--ink)} .io .ns{fill:var(--muted)}
.rem rect{fill:var(--rem-fill);stroke:var(--rem)} .rem text{fill:var(--ink)} .rem .ns{fill:var(--rem)}
.warn rect{fill:var(--warn-fill);stroke:var(--warn)} .warn text{fill:var(--ink)} .warn .ns{fill:var(--warn)}
.wire{stroke:var(--io);stroke-width:1.3;fill:none}
.wire-d{stroke:var(--io);stroke-width:1.3;fill:none;stroke-dasharray:5 4}
.lbl{font:11px var(--mono);fill:var(--muted)}
.panel{background:var(--surface);border:1px solid var(--rule);border-radius:12px;padding:22px 24px;display:grid;gap:16px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);max-height:calc(100vh - 32px);overflow-y:auto}
@media (max-width:900px){.panel{position:static;max-height:none}}
.kind{display:inline-flex;align-items:center;gap:6px;font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:5px 8px;border-radius:4px;justify-self:start}
.kind.det{background:var(--det-fill);color:var(--det)} .kind.ml{background:var(--ml-fill);color:var(--ml)}
.kind.io{background:var(--io-fill);color:var(--muted)} .kind.rem{background:var(--rem-fill);color:var(--rem)}
.kind.warn{background:var(--warn-fill);color:var(--warn)}
.panel h2{font:600 24px/1.2 var(--cond);margin:0;text-wrap:balance}
.panel .lede{margin:0;font-size:16px}
.panel h3{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.panel ul{margin:0;padding-left:18px;display:grid;gap:6px}
.panel p{margin:0}
dl.nums{display:grid;grid-template-columns:auto 1fr;gap:6px 16px;margin:0;font-variant-numeric:tabular-nums}
dl.nums dt{font:500 14px var(--mono);white-space:nowrap}
dl.nums dd{margin:0;color:var(--muted)}
.ship{background:var(--det-fill);border-radius:8px;padding:14px 16px}
.ship h3{color:var(--det)}
.fragile{background:var(--warn-fill);border-radius:8px;padding:14px 16px}
.fragile h3{color:var(--warn)}
.ref{font:12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.nav{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--rule);padding-top:14px}
.nav button{font:500 13px var(--sans);background:none;border:1px solid var(--rule);color:var(--ink);padding:8px 12px;border-radius:6px;cursor:pointer;text-align:left}
.nav button:disabled{opacity:.4;cursor:default}
.nav button:focus-visible,.tabs button:focus-visible,.pairs button:focus-visible,.ptabs button:focus-visible,.copy:focus-visible,.snip a:focus-visible{outline:2px solid var(--det);outline-offset:2px}
code{font:12.5px var(--mono);background:var(--io-fill);padding:1px 4px;border-radius:3px}
/* worked-example widgets */
.pairs{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 10px}
.pairs button{font:500 12px/1 var(--mono);background:none;border:1px solid var(--rule);color:var(--ink);padding:7px 10px;border-radius:6px;cursor:pointer}
.pairs button[aria-pressed="true"]{background:var(--ml-fill);border-color:var(--ml);color:var(--ml)}
.wf-desc{margin:0 0 8px;color:var(--muted);font-size:13.5px}
.wf{display:grid;font-variant-numeric:tabular-nums}
.wf .row{display:grid;grid-template-columns:120px minmax(0,1fr) 46px;align-items:center;column-gap:8px;height:22px;font-size:12.5px}
.wf .lab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.wf .trk{position:relative;height:22px}
.wf .trk i{position:absolute;top:4px;height:14px;border-radius:2px}
.wf .trk .zero{top:0;bottom:0;height:auto;width:1px;background:var(--rule);border-radius:0}
.wf .trk .thr{top:0;bottom:0;height:auto;width:0;border-left:1px dashed var(--muted);border-radius:0}
.wf .pos{background:var(--det)} .wf .neg{background:var(--rem)}
.wf .val{text-align:right;font-family:var(--mono);font-size:12px}
.wf .tot .lab{color:var(--ink);font-weight:500}
.wf .tot{border-top:1px solid var(--rule);margin-top:4px;height:26px}
.wf-key{margin:8px 0 0;font:12px/1.4 var(--mono);color:var(--muted)}
.chk{display:grid;border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.crow{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 54px;gap:4px 10px;align-items:center;padding:8px 10px;font-size:13px;border-top:1px solid var(--rule)}
.crow:first-child{border-top:0}
.crow .cl{color:var(--ink);min-width:0;overflow-wrap:anywhere}
.crow .cv{font:12px var(--mono);color:var(--muted);text-align:right;overflow-wrap:anywhere}
.crow .cs{font:500 11px/1 var(--mono);text-align:center;padding:4px 0;border-radius:4px}
.cs.pass{background:var(--det-fill);color:var(--det)} .cs.fail{background:var(--rem-fill);color:var(--rem)} .cs.info{background:var(--io-fill);color:var(--muted)}
.wf-key.vok{color:var(--det)} .wf-key.vno{color:var(--rem)}
/* panel tabs and code */
.ptabs{display:flex;gap:4px;background:var(--io-fill);padding:3px;border-radius:8px;justify-self:start}
.ptabs button{font:500 12.5px/1 var(--sans);color:var(--muted);background:none;border:0;padding:8px 12px;border-radius:6px;cursor:pointer}
.ptabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.codenote{margin:0;font:12px/1.5 var(--mono);color:var(--muted)}
.snip{margin:0;display:grid;gap:6px;min-width:0}
.snip figcaption{display:flex;flex-wrap:wrap;justify-content:space-between;gap:2px 12px;font-size:13.5px;line-height:1.45}
.snip figcaption a{font:12px/1.5 var(--mono);color:var(--det);text-decoration:none;overflow-wrap:anywhere}
.snip figcaption a:hover{text-decoration:underline}
.acts{display:flex;align-items:center;gap:10px;min-width:0}
.cbody{background:var(--io-fill);border:1px solid var(--rule);border-radius:8px;overflow:hidden}
.src{padding-block:10px;font:11.5px/1.55 var(--mono)}
.ln{display:flex;min-width:0}
.no{flex:none;box-sizing:content-box;width:2.6em;text-align:right;padding-right:9px;margin-right:11px;color:var(--io);border-right:1px solid var(--rule);user-select:none}
.tx{flex:1;min-width:0;white-space:pre-wrap;overflow-wrap:anywhere;padding-left:min(calc((var(--i) + 4) * 1ch), 50%);text-indent:calc(-4 * 1ch);padding-right:12px}
.nonum .no{display:none}
.nonum .tx{padding-left:min(calc((var(--i) + 4) * 1ch + 12px), 50%)}
@media (min-width:901px){.main.wide{grid-template-columns:minmax(0,1fr) minmax(0,1.2fr)}}
.copy{font:500 11px/1 var(--mono);background:var(--surface);color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:5px 8px;cursor:pointer;flex:none}
.src .hljs-keyword,.src .hljs-literal,.src .hljs-built_in,.src .hljs-type{color:var(--ml)}
.src .hljs-string,.src .hljs-regexp{color:var(--det)}
.src .hljs-comment,.src .hljs-doctag{color:var(--muted);font-style:italic}
.src .hljs-number,.src .hljs-title,.src .hljs-symbol,.src .hljs-attr{color:var(--warn)}
.src .hljs-meta,.src .hljs-variable{color:var(--rem)}

/* release-evidence tab */
.ev-sec{display:grid;gap:8px}
.ev-tables{margin:0;display:grid;grid-template-columns:minmax(0,14em) minmax(0,1fr);gap:6px 14px}
@media (max-width:600px){.ev-tables{grid-template-columns:minmax(0,1fr);gap:0}.ev-tables dd{margin-bottom:8px}}
.ev-tables dt{font:500 12.5px/1.5 var(--mono);color:var(--det);overflow-wrap:anywhere}
.ev-tables dd{margin:0;color:var(--ink);font-size:14px;min-width:0}
.panel li,.panel .lede{overflow-wrap:anywhere}
.ex{margin:0;display:grid;gap:6px;min-width:0}
.ex figcaption{font-size:13.5px;line-height:1.45}
.ex figcaption b{font:500 12.5px var(--mono);color:var(--det)}
.etbl{border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--io-fill)}
.etbl .tr{display:grid;grid-template-columns:repeat(var(--n),minmax(0,1fr));gap:0 8px;padding:6px 10px;font:11px/1.5 var(--mono);border-top:1px solid var(--rule)}
.etbl .tr:first-child{border-top:0}
.etbl .th{font-weight:500;color:var(--muted);background:var(--surface)}
.etbl .tr span{min-width:0;overflow-wrap:anywhere}
.ex-src{font:12px/1.5 var(--mono);color:var(--muted);margin:0}
.ex-src a{color:var(--det);text-decoration:none}
.ex-src a:hover{text-decoration:underline}
.ex-note{margin:0;font-size:13px;color:var(--muted)}
@media (prefers-reduced-motion:reduce){.n rect{transition:none}}
</style>

<div class="wrap">
  <header>
    <span class="eyebrow">{{EYEBROW}}</span>
    <h1>{{HEADING}}</h1>
    <p>{{INTRO}}</p>
  </header>

  <div class="bar">
    <div class="tabs" role="tablist" aria-label="Diagram">
{{VIEW_TABS}}
    </div>
    <div class="legend" aria-label="Legend">
{{LEGEND}}
    </div>
  </div>

  <div class="main">
    <div>
{{VIEWS}}
      <p class="hint">{{HINT}}</p>
    </div>

    <aside class="panel" id="panel" aria-live="polite"></aside>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>
const SPEC = {{SPEC_JSON}};
const D = SPEC.nodes, SN = SPEC.snippets, WIDGETS = SPEC.widgets || {}, LABELS = SPEC.labels, ORDER = SPEC.order;
const viewOf = {};
Object.entries(ORDER).forEach(([v, ids]) => ids.forEach(id => { viewOf[id] = v; }));
const CODE = {};
Object.entries(D).forEach(([id, d]) => { CODE[id] = d.code || []; });
const panel = document.getElementById("panel");
let view = SPEC.views[0].id, current = SPEC.default_node, tab = "note";
const wstate = {};
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const hasCode = id => CODE[id].length > 0;

/* ---- worked-example widgets ---- */
function waterfallHTML(w, key){
  const c = w.cases[key];
  const rows = (w.base || []).concat(c.steps || []);
  let sum = rows.reduce((s, r) => s + r[1], 0);
  if (c.total != null && Math.abs(c.total - sum) > 0.005) { rows.push([c.remainder_label || "Other", +(c.total - sum).toFixed(2)]); sum = c.total; }
  const total = c.total != null ? c.total : sum, MIN = w.min, MAX = w.max, THR = w.threshold;
  const pct = v => ((v - MIN) / (MAX - MIN) * 100).toFixed(2);
  const marks = `<i class="zero" style="left:${pct(0)}%"></i><i class="thr" style="left:${pct(THR)}%"></i>`;
  let run = 0;
  const body = rows.map(([lab, v]) => {
    const a = run, b = run + v; run = b;
    return `<div class="row"><span class="lab">${esc(lab)}</span><span class="trk">${marks}<i class="${v >= 0 ? "pos" : "neg"}" style="left:${pct(Math.min(a, b))}%;width:${(Math.abs(v) / (MAX - MIN) * 100).toFixed(2)}%"></i></span><span class="val">${v >= 0 ? "+" : "−"}${Math.abs(v).toFixed(1)}</span></div>`;
  }).join("");
  const ok = total >= THR;
  const tot = `<div class="row tot"><span class="lab">${esc(w.total_label || "Total")}</span><span class="trk">${marks}<i class="${ok ? "pos" : "neg"}" style="left:${pct(Math.min(0, total))}%;width:${(Math.abs(total) / (MAX - MIN) * 100).toFixed(2)}%"></i></span><span class="val">${total.toFixed(1)}</span></div>`;
  return `<p class="wf-desc">${esc(c.note || "")}</p><div class="wf" role="img" aria-label="${esc(key)}: total ${total.toFixed(1)} ${esc(w.unit || "")} against ${THR.toFixed(1)} needed">${body}${tot}</div>
    <p class="wf-key">Dashed line: ${THR.toFixed(1)} ${esc(w.unit || "")}${w.threshold_label ? ", " + esc(w.threshold_label) : ""}. Total ${total.toFixed(1)}, so ${esc(ok ? (w.pass_text || "the threshold is met") : (w.fail_text || "the threshold is not met"))}.</p>`;
}
function checksHTML(w, key){
  const c = w.cases[key];
  return `<p class="wf-desc">${esc(c.note || "")}</p><div class="chk">${c.rows.map(([l, v, s]) => `<div class="crow"><span class="cl">${esc(l)}</span><span class="cv">${esc(v)}</span><span class="cs ${s}">${s === "pass" ? "pass" : s === "fail" ? "fail" : "info"}</span></div>`).join("")}</div>
    <p class="wf-key ${c.verdict.ok ? "vok" : "vno"}">${esc(c.verdict.text)}</p>`;
}
function widgetHTML(name){
  const w = WIDGETS[name]; if(!w) return "";
  return `<section class="wbox" data-w="${esc(name)}"><h3>${esc(w.title || "Worked examples")}</h3><div class="pairs">${Object.keys(w.cases).map(k => `<button type="button" data-k="${esc(k)}" aria-pressed="false">${esc(k)}</button>`).join("")}</div><div class="wbody"></div></section>`;
}
function initWidget(){
  const box = panel.querySelector(".wbox"); if(!box) return;
  const name = box.dataset.w, w = WIDGETS[name];
  if(!wstate[name]) wstate[name] = w.default || Object.keys(w.cases)[0];
  const draw = () => {
    box.querySelectorAll(".pairs button").forEach(b => b.setAttribute("aria-pressed", b.dataset.k === wstate[name]));
    box.querySelector(".wbody").innerHTML = w.type === "checks" ? checksHTML(w, wstate[name]) : waterfallHTML(w, wstate[name]);
  };
  box.querySelectorAll(".pairs button").forEach(b => { b.onclick = () => { wstate[name] = b.dataset.k; draw(); }; });
  draw();
}

/* ---- code tab: verbatim excerpts, wrapped with a hanging indent ---- */
function hl(code, lang){
  try { if(window.hljs && lang) return hljs.highlight(code, {language: lang, ignoreIllegals: true}).value; } catch(e) {}
  return esc(code);
}
function splitLines(html){
  const out = [], open = []; let cur = "";
  for (const t of html.match(/<span[^>]*>|<\/span>|\n|[^<\n]+/g) || []) {
    if (t === "\n") { out.push(cur + "</span>".repeat(open.length)); cur = open.join(""); }
    else { if (t[0] === "<") { if (t[1] === "/") open.pop(); else open.push(t); } cur += t; }
  }
  out.push(cur); return out;
}
function codeRows(s){
  const raw = s.code.split("\n"), rows = splitLines(hl(s.code, s.lang));
  if (rows.length !== raw.length) return esc(s.code);
  return rows.map((h, i) => {
    const ind = raw[i].match(/^ */)[0].length;
    return `<div class="ln"><span class="no" aria-hidden="true">${s.a ? s.a + i : ""}</span><span class="tx" style="--i:${ind}">${h.replace(/^((?:<span[^>]*>)*) */, "$1")}</span></div>`;
  }).join("");
}
function codeHTML(id){
  return `<p class="codenote">Excerpts from the repositories, unedited apart from removing shared indentation. Long lines wrap with a hanging indent. Line numbers match the linked source.</p>` +
    CODE[id].map(k => {
      const s = SN[k];
      return `<figure class="snip"><figcaption><span>${esc(s.caption)}</span><span class="acts"><button class="copy" type="button" data-k="${esc(k)}">Copy</button><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.label)} ↗</a></span></figcaption>
        <div class="cbody"><div class="src${s.a ? "" : " nonum"}" role="group" aria-label="Code excerpt">${codeRows(s)}</div></div></figure>`;
    }).join("");
}

/* ---- release-evidence tab: what is recorded, where it is stored, real rows ---- */
const hasEv = id => !!(D[id] && D[id].evidence);
function exampleHTML(x){
  const n = x.cols.length;
  // column widths follow the longest value, so ids stay on one line and a long detail cannot take the row
  const w = x.cols.map((c, i) => Math.max(4, Math.min(26, Math.max(c.length, ...x.rows.map(r => String(r[i]).length)))));
  const g = `grid-template-columns:${w.map(v => `minmax(0,${v}fr)`).join(" ")}`;
  const head = `<div class="tr th" style="${g}">${x.cols.map(c => `<span>${esc(c)}</span>`).join("")}</div>`;
  const rows = x.rows.map(r => `<div class="tr" style="${g}">${r.map(v => `<span>${esc(v)}</span>`).join("")}</div>`).join("");
  const more = x.total > x.rows.length ? `${x.rows.length} of ${x.total} matching rows shown. ` : (x.total > 1 ? `All ${x.total} matching rows. ` : "");
  return `<figure class="ex"><figcaption><b>${esc(x.table)}</b> · ${esc(x.caption)}</figcaption><div class="etbl" role="table" aria-label="${esc(x.table)}">${head}${rows}</div>
    <p class="ex-src">${more}${esc(x.source)}${x.url ? ` · <a href="${esc(x.url)}" target="_blank" rel="noopener">release ↗</a>` : ""}</p>${x.note ? `<p class="ex-note">${esc(x.note)}</p>` : ""}</figure>`;
}
function evidenceHTML(id){
  const e = D[id].evidence;
  return `<p class="lede">${esc(e.lede)}</p>
    <section><h3>${esc(LABELS.ev_recorded)}</h3><ul>${e.recorded.map(w => `<li>${esc(w)}</li>`).join("")}</ul></section>
    <section class="ev-sec"><h3>${esc(LABELS.ev_tables)}</h3><dl class="ev-tables">${e.tables.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl></section>
    ${e.examples && e.examples.length ? `<section class="ev-sec"><h3>${esc(LABELS.ev_rows)}</h3>${e.examples.map(exampleHTML).join("")}</section>` : ""}
    ${e.limits && e.limits.length ? `<section class="fragile"><h3>${esc(LABELS.ev_limits)}</h3><ul>${e.limits.map(w => `<li>${esc(w)}</li>`).join("")}</ul></section>` : ""}`;
}

/* ---- panel ---- */
function show(id, focusPanel){
  const d = D[id]; if(!d) return;
  current = id; view = viewOf[id]; setTab(view);
  document.querySelectorAll(".n").forEach(n => {
    const on = n.dataset.id === id; n.classList.toggle("sel", on); n.setAttribute("aria-pressed", on);
  });
  const list = ORDER[view], i = list.indexOf(id);
  const shortTitle = t => esc(t.replace(/^\d+[a-z]? · /, ""));
  const useCode = tab === "code" && hasCode(id), useEv = tab === "ev" && hasEv(id) && !useCode;
  document.querySelector(".main").classList.toggle("wide", useCode || useEv);
  const body = useCode ? codeHTML(id) : useEv ? evidenceHTML(id) : `
     <p class="lede">${esc(d.lede)}</p>
     <section><h3>${esc(LABELS.what)}</h3><ul>${d.what.map(w => `<li>${esc(w)}</li>`).join("")}</ul></section>
     ${d.widget ? widgetHTML(d.widget) : ""}
     ${d.nums && d.nums.length ? `<section><h3>${esc(LABELS.nums)}</h3><dl class="nums">${d.nums.map(([a, b]) => `<dt>${esc(a)}</dt><dd>${esc(b)}</dd>`).join("")}</dl></section>` : ""}
     ${d.measured && d.measured.length ? `<section class="ship"><h3>${esc(LABELS.measured)}</h3><ul>${d.measured.map(w => `<li>${esc(w)}</li>`).join("")}</ul></section>` : ""}
     ${d.open && d.open.length ? `<section class="fragile"><h3>${esc(LABELS.open)}</h3><ul>${d.open.map(w => `<li>${esc(w)}</li>`).join("")}</ul></section>` : ""}`;
  panel.innerHTML =
    `<span class="kind ${d.kind}">${esc(d.tag)}</span>
     <h2 tabindex="-1">${esc(d.title)}</h2>
     ${hasCode(id) || hasEv(id) ? `<div class="ptabs" role="tablist" aria-label="Panel view"><button type="button" role="tab" data-t="note" aria-selected="${!useCode && !useEv}">${esc(LABELS.tab_note)}</button>${hasEv(id) ? `<button type="button" role="tab" data-t="ev" aria-selected="${useEv}">${esc(LABELS.tab_evidence)}</button>` : ""}${hasCode(id) ? `<button type="button" role="tab" data-t="code" aria-selected="${useCode}">${esc(LABELS.tab_code)}</button>` : ""}</div>` : ""}
     ${body}
     <p class="ref">${esc(d.ref)}</p>
     <div class="nav"><button id="prev" ${i <= 0 ? "disabled" : ""}>← ${i > 0 ? shortTitle(D[list[i - 1]].title) : "Previous"}</button>
     <button id="next" ${i >= list.length - 1 ? "disabled" : ""}>${i < list.length - 1 ? shortTitle(D[list[i + 1]].title) : "Next"} →</button></div>`;
  document.getElementById("prev").onclick = () => show(list[i - 1], true);
  document.getElementById("next").onclick = () => show(list[i + 1], true);
  panel.querySelectorAll(".ptabs button").forEach(b => { b.onclick = () => { tab = b.dataset.t; show(id, false); }; });
  panel.querySelectorAll(".copy").forEach(b => { b.onclick = () => {
    const code = SN[b.dataset.k].code;
    const done = () => { b.textContent = "Copied"; setTimeout(() => { b.textContent = "Copy"; }, 1500); };
    const fallback = () => { const r = document.createRange(); r.selectNodeContents(b.closest("figure").querySelector(".src")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); b.textContent = "Press Ctrl+C"; };
    if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(code).then(done, fallback); else fallback();
  }; });
  initWidget();
  try { history.replaceState(null, "", "#" + id + (useCode ? "-code" : useEv ? "-evidence" : "")); } catch(e) {}
  if(focusPanel){
    panel.querySelector("h2").focus({preventScroll: true});
    if(window.matchMedia("(max-width:900px)").matches) panel.scrollIntoView({behavior: matchMedia("(prefers-reduced-motion:reduce)").matches ? "auto" : "smooth", block: "start"});
  }
}
function setTab(v){
  SPEC.views.forEach(x => {
    document.getElementById("view-" + x.id).hidden = x.id !== v;
    document.getElementById("tab-" + x.id).setAttribute("aria-selected", x.id === v);
  });
}
document.querySelectorAll(".n").forEach(n => {
  n.addEventListener("click", () => show(n.dataset.id, true));
  n.addEventListener("keydown", e => { if(e.key === "Enter" || e.key === " "){ e.preventDefault(); show(n.dataset.id, true); } });
});
SPEC.views.forEach(x => { document.getElementById("tab-" + x.id).onclick = () => show(view === x.id ? current : x.default_node); });
let h = (location.hash || "").slice(1);
if(h.endsWith("-code")){ tab = "code"; h = h.slice(0, -5); }
else if(h.endsWith("-evidence")){ tab = "ev"; h = h.slice(0, -9); }
show(D[h] ? h : SPEC.default_node, false);
</script>
