[client]
showErrorDetails = "none"
toolbarMode = "minimal"      # hides the Deploy button and the developer menu

[theme]
base = "light"
primaryColor = "#d4a017"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#eef1f5"
textColor = "#1b2430"
showWidgetBorder = true

[theme.sidebar]
backgroundColor = "#0a1629"
textColor = "#ffffff"
secondaryBackgroundColor = "#12243f"
primaryColor = "#d4a017"
borderColor = "#22344b"
