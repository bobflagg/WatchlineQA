[project]
name = "watchlineqa"
version = "0.1.0"
description = "Accountability AI assistant for New York City rental housing"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "deepagents>=0.7.41",
    "httpx>=0.28.1",
    "langchain>=1.5.2",
    "langchain-anthropic>=1.7.12",
    "neo4j>=6.4.1",
    "pydantic>=2.14.4",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["watchline"]

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "nbconvert>=7.17.2",
    "nbformat>=5.11.1",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]


[tool.ruff]
line-length = 120
extend-exclude = ["ignore-this-directory", ".claude"]

[tool.ruff.lint]
# Basics only: pycodestyle errors, pyflakes, import order.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.isort]
known-third-party = ["geosupport"]

[tool.pytest.ini_options]
markers = ["llm: calls a model (needs ANTHROPIC_API_KEY, costs money, output varies); run with make eval-agent"]
